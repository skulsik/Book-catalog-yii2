services:

  php:
    build: .
    container_name: yii2_php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - yii2net

  nginx:
    image: nginx:stable-alpine
    container_name: yii2_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - yii2net

  mysql:
    image: mysql:8
    container_name: yii2_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2_books
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - yii2net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: yii2_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - yii2net

volumes:
  mysql_data:

networks:
  yii2net:
    driver: bridge
